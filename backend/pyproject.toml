[project]
name = "sentinel-mail-backend"
version = "0.1.0"
description = "Sentinel Mail backend (API + shared models/services used by the worker)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "httpx>=0.27",
    "imapclient>=3.0",
    "apscheduler>=3.10",
    "zeroconf>=0.132",
    "pycups>=2.0.4; sys_platform != 'win32'",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

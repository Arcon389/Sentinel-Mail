# Minimal CUPS config allowing the Sentinel Mail backend (same Docker network)
# to administer queues via IPP. Tightened in Milestone 4 alongside printer setup.
LogLevel warn
Listen *:631
Listen /run/cups/cups.sock
ServerAlias *

<Location />
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  Order allow,deny
  Allow all
</Location>

DefaultAuthType Basic
WebInterface Yes

# This CUPS instance is only reachable from other containers on the
# Sentinel Mail docker-compose network (not published beyond CUPS_SERVER_PORT
# for admin purposes) - the backend needs to add/remove/print without
# per-request credentials, so admin operations are allowed without auth here.
<Policy default>
  <Limit All>
    AuthType None
    Order allow,deny
    Allow all
  </Limit>
</Policy>

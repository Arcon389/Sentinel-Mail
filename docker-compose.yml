name: sentinel-mail

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_mail}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel_mail}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./backend
    image: sentinel-mail-web
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@db:5432/${POSTGRES_DB:-sentinel_mail}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: sentinel-mail-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@db:5432/${POSTGRES_DB:-sentinel_mail}
    depends_on:
      db:
        condition: service_healthy

  cups:
    build:
      context: ./cups
    image: sentinel-mail-cups
    restart: unless-stopped
    # Printer discovery (mDNS + SNMP) runs inside THIS container via CUPS, and
    # printing relays through it too. On the Docker bridge network, mDNS
    # multicast and SNMP broadcasts stay inside the container's subnet and never
    # reach the LAN, so network printers (e.g. on 192.168.x.x) aren't found.
    # `network_mode: host` gives CUPS direct access to the host's LAN so both
    # discovery and printing work. Note: on Docker Desktop (Windows/macOS) the
    # "host" is the Linux VM, not the physical LAN - there, add printers by URI
    # manually (e.g. ipp://<ip>/ipp/print).
    network_mode: host
    volumes:
      - cups_config:/etc/cups
    # With network_mode: host, port 631 is already published on the host; a
    # `ports:` mapping would conflict, so it is intentionally omitted.

  frontend:
    build:
      context: ./frontend
    image: sentinel-mail-frontend
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${WEB_SERVER_PORT:-3000}:80"

volumes:
  db_data:
  cups_config:

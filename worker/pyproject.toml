[project]
name = "sentinel-mail-worker"
version = "0.1.0"
description = "Sentinel Mail background worker (IMAP polling + action chain execution)"
requires-python = ">=3.12"
dependencies = [
    "sentinel-mail-backend",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]
